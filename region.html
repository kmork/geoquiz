<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Geo Quiz - Choose Region</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script>
    (function() {
      const saved = localStorage.getItem('geoquiz-theme');
      const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const theme = saved || system;
      if (theme === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/region.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <div class="map-background"></div>
  <div class="map-dots"></div>

  <div class="content">
    <div class="game-header" id="game-header">
      <!-- Filled by JS -->
    </div>

    <div id="region-cards">
      <!-- Filled by JS -->
    </div>
  </div>

  <script>
    const GAMES = {
      find: {
        title: 'Find the Country',
        desc: 'Locate and click on the correct country on the interactive world map.',
        fullCount: 194,
        icon: '🗺️'
      },
      outlines: {
        title: 'Country Outline',
        desc: 'Identify countries from their unique shapes and rotate them to their correct orientation.',
        fullCount: 194,
        icon: `<img src="img/icon-logo-small.svg" alt="" style="width:1.2em;height:1.2em;vertical-align:-0.15em">`
      },
      capitals: {
        title: 'Cities',
        desc: 'Guess the capitals and their locations on an interactive world map.',
        fullCount: 194,
        icon: '🏛️'
      },
      flags: {
        title: 'Flags of the World',
        desc: 'Match the flag to the country — nearby neighbors make it tricky.',
        fullCount: 194,
        icon: '🚩'
      },
      route: {
        title: 'Connect the Countries',
        desc: 'Find the land route between two countries through neighboring borders.',
        fullCount: 194,
        icon: '🔗',
        continentSlugs: ['africa', 'americas', 'asia', 'europe'],
      },
      'capital-pairs': {
        title: 'Capital Pairs',
        desc: 'Match countries with their capitals — one wrong answer ends your streak.',
        fullCount: 194,
        icon: '🔗',
        directUrl: 'capital-pairs.html',
      },
      duel: {
        title: 'Country Duel',
        desc: 'Two countries face off — pick the right answer to keep your streak alive!',
        fullCount: 194,
        icon: '🆚',
        directUrl: 'duel.html',
      },
    };

    const CONTINENTS = [
      { label: 'Africa',   slug: 'africa',   continent: 'Africa',   emoji: '🌍' },
      { label: 'Americas', slug: 'americas', continent: 'Americas', emoji: '🌎' },
      { label: 'Asia',     slug: 'asia',     continent: 'Asia',     emoji: '🌏' },
      { label: 'Europe',   slug: 'europe',   continent: 'Europe',   emoji: '🌍' },
      { label: 'Oceania',  slug: 'oceania',  continent: 'Oceania',  emoji: '🌏' },
    ];

    const params = new URLSearchParams(location.search);
    const gameKey = params.get('game');
    const game = GAMES[gameKey];

    if (!game) {
      // Unknown game or doesn't support continents — go straight to play.html
      const fallback = gameKey ? `play.html?game=${encodeURIComponent(gameKey)}` : 'index.html';
      location.href = fallback;
    } else {
      document.title = `Geo Quiz - ${game.title}`;

      document.getElementById('game-header').innerHTML = `
        <a href="index.html" style="text-decoration:none"><div class="game-icon-large">${game.icon}</div></a>
        <a href="index.html" class="game-title">${game.title}</a>
        <p class="game-desc">${game.desc}</p>
      `;

      function makeCard(href, emoji, name, subtitle) {
        return `
          <a class="diff-card" href="${href}">
            <span class="diff-emoji">${emoji}</span>
            <div class="diff-info">
              <div class="diff-name">${name}</div>
              <div class="diff-rounds">${subtitle}</div>
              <span class="diff-play">Play →</span>
            </div>
          </a>`;
      }

      (async () => {
        let countriesData = null;
        try {
          countriesData = await fetch('data/countries.json').then(r => r.json());
        } catch (e) {
          console.warn('Could not load countries:', e);
        }

        function countFor(continent) {
          if (!countriesData) return '…';
          return countriesData.filter(c => c.un && c.continent === continent).length;
        }

        const totalCount = game.fullCount || '194';

        // World card — separate hero element
        const worldHref = game.directUrl || `play.html?game=${encodeURIComponent(gameKey)}`;
        const laurelLeft = `<svg class="laurel laurel-left" viewBox="0 0 60 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M48 115C48 115 44 90 36 72C28 54 14 38 14 38" stroke="var(--accent-color)" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
              <ellipse cx="24" cy="28" rx="10" ry="5.5" transform="rotate(-35 24 28)" fill="var(--accent-color)" opacity="0.18"/>
              <ellipse cx="16" cy="42" rx="10" ry="5.5" transform="rotate(-22 16 42)" fill="var(--accent-color)" opacity="0.18"/>
              <ellipse cx="14" cy="56" rx="10" ry="5.5" transform="rotate(-10 14 56)" fill="var(--accent-color)" opacity="0.18"/>
              <ellipse cx="18" cy="70" rx="10" ry="5.5" transform="rotate(5 18 70)" fill="var(--accent-color)" opacity="0.18"/>
              <ellipse cx="26" cy="82" rx="10" ry="5.5" transform="rotate(15 26 82)" fill="var(--accent-color)" opacity="0.18"/>
              <ellipse cx="34" cy="93" rx="10" ry="5.5" transform="rotate(25 34 93)" fill="var(--accent-color)" opacity="0.18"/>
              <ellipse cx="42" cy="103" rx="9" ry="5" transform="rotate(32 42 103)" fill="var(--accent-color)" opacity="0.18"/>
            </svg>`;
        const laurelRight = `<svg class="laurel laurel-right" viewBox="0 0 60 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 115C12 115 16 90 24 72C32 54 46 38 46 38" stroke="var(--accent-color)" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
              <ellipse cx="36" cy="28" rx="10" ry="5.5" transform="rotate(35 36 28)" fill="var(--accent-color)" opacity="0.18"/>
              <ellipse cx="44" cy="42" rx="10" ry="5.5" transform="rotate(22 44 42)" fill="var(--accent-color)" opacity="0.18"/>
              <ellipse cx="46" cy="56" rx="10" ry="5.5" transform="rotate(10 46 56)" fill="var(--accent-color)" opacity="0.18"/>
              <ellipse cx="42" cy="70" rx="10" ry="5.5" transform="rotate(-5 42 70)" fill="var(--accent-color)" opacity="0.18"/>
              <ellipse cx="34" cy="82" rx="10" ry="5.5" transform="rotate(-15 34 82)" fill="var(--accent-color)" opacity="0.18"/>
              <ellipse cx="26" cy="93" rx="10" ry="5.5" transform="rotate(-25 26 93)" fill="var(--accent-color)" opacity="0.18"/>
              <ellipse cx="18" cy="103" rx="9" ry="5" transform="rotate(-32 18 103)" fill="var(--accent-color)" opacity="0.18"/>
            </svg>`;

        const worldCard = `
          <a class="world-card diff-card" href="${worldHref}">
            ${laurelLeft}
            <span class="diff-emoji">🌐</span>
            <div class="diff-info">
              <div class="diff-name">World</div>
              <div class="diff-rounds">All ${totalCount} countries</div>
              <span class="diff-play">Play →</span>
            </div>
            ${laurelRight}
          </a>`;

        // Continent cards in grid
        const contList = game.continentSlugs
          ? CONTINENTS.filter(c => game.continentSlugs.includes(c.slug))
          : CONTINENTS;

        let continentCards = '';
        contList.forEach(c => {
          const count = countFor(c.continent);
          const href = game.directUrl
            ? `${game.directUrl}?continent=${encodeURIComponent(c.continent)}`
            : `play.html?game=${encodeURIComponent(gameKey)}&continent=${encodeURIComponent(c.continent)}`;
          continentCards += makeCard(href, c.emoji, c.label, `${count} countries`);
        });

        document.getElementById('region-cards').innerHTML =
          worldCard + `<div class="card-grid">${continentCards}</div>`;
      })();
    }
  </script>

  <script src="js/menu.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
