<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Mountain Ranges Quiz</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Prevent FOUC - apply theme immediately
    (function() {
      const saved = localStorage.getItem('geoquiz-theme');
      const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const theme = saved || system;
      if (theme === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>
  <style>
    .feature-name {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin: 8px 0 4px;
      color: var(--text-primary);
    }
    .type-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(180,120,60,0.18);
      border: 1px solid rgba(180,120,60,0.4);
      color: #cd853f;
      vertical-align: middle;
      margin-right: 6px;
    }
    .hint-text {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin: 0 0 6px;
      font-style: italic;
      padding: 0 16px;
    }
    .mapwrap {
      position: relative;
    }
  </style>
</head>

<body>
<div class="wrap mountains-page">
  <div class="card">

    <div id="init-overlay">
      <div class="spinner"></div>
      <div>Loading GeoQuiz...</div>
    </div>

    <div class="row row-space-between">
      <div>
        <h1>
          <a href="index.html" style="text-decoration: none; color: inherit;">
            <span class="game-header-icon">⛰️</span>
            Mountain Ranges
          </a>
        </h1>
        <div class="muted" id="game-desc">Click all countries the mountain range spans, then submit your answer.</div>
      </div>
      <div class="row">
        <div class="pill">Score: <b id="score">0</b></div>
        <div class="pill">Round: <b id="progress">0 / 16</b></div>
      </div>
    </div>

    <div class="hr"></div>

    <div class="feature-name" id="featureName">—</div>

    <div class="mapwrap">
      <canvas id="map"></canvas>
    </div>

  </div>
</div>

<!-- Final score screen (content generated by JS) -->
<div class="overlay" id="finalOverlay" role="dialog" aria-modal="true"></div>

<canvas id="confetti"></canvas>

<script src="js/pako.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/data.js"></script>
<script type="module" src="js/mountains-main.js"></script>

</body>
</html>
