<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Geo Quiz - Select Difficulty</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    (function() {
      const saved = localStorage.getItem('geoquiz-theme');
      const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const theme = saved || system;
      if (theme === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg-primary: #0f172a;
      --bg-gradient-1: rgba(59, 130, 246, 0.1);
      --bg-gradient-2: rgba(139, 92, 246, 0.1);
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --accent-color: #3b82f6;
      --accent-color-rgb: 59, 130, 246;
      --dot-color: rgba(59, 130, 246, 0.3);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-bg-hover: rgba(255, 255, 255, 0.1);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-border-hover: rgba(59, 130, 246, 0.5);
      --card-shadow: rgba(59, 130, 246, 0.3);
      --button-bg: rgba(59, 130, 246, 0.2);
      --button-bg-hover: rgba(59, 130, 246, 0.4);
      --button-border: rgba(59, 130, 246, 0.4);
      --button-border-hover: rgba(59, 130, 246, 0.6);
      --button-text: #60a5fa;
      --button-text-hover: #ffffff;
      --globe-gradient-1: #3b82f6;
      --globe-gradient-2: #8b5cf6;
      --ring-color: rgba(59, 130, 246, 0.3);
    }

    html.light-mode,
    body.light-mode {
      --bg-primary: linear-gradient(to bottom, #f8fafc 0%, #e2e8f0 100%);
      --bg-gradient-1: rgba(59, 130, 246, 0.05);
      --bg-gradient-2: rgba(139, 92, 246, 0.05);
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --accent-color: #2563eb;
      --accent-color-rgb: 37, 99, 235;
      --dot-color: rgba(100, 116, 139, 0.15);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-bg-hover: rgba(255, 255, 255, 1);
      --card-border: rgba(0, 0, 0, 0.08);
      --card-border-hover: rgba(37, 99, 235, 0.4);
      --card-shadow: rgba(0, 0, 0, 0.1);
      --button-bg: rgba(37, 99, 235, 0.1);
      --button-bg-hover: rgba(37, 99, 235, 0.2);
      --button-border: rgba(37, 99, 235, 0.3);
      --button-border-hover: rgba(37, 99, 235, 0.5);
      --button-text: #2563eb;
      --button-text-hover: #1e40af;
      --globe-gradient-1: #1e3a8a;
      --globe-gradient-2: #581c87;
      --ring-color: rgba(59, 130, 246, 0.2);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    .map-background {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(circle at 20% 50%, var(--bg-gradient-1) 0%, transparent 50%),
        radial-gradient(circle at 80% 50%, var(--bg-gradient-2) 0%, transparent 50%);
      z-index: 0;
    }

    .map-dots {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-image: radial-gradient(circle, var(--dot-color) 1px, transparent 1px);
      background-size: 50px 50px;
      opacity: 0.3;
      animation: map-float 20s ease-in-out infinite;
    }

    @keyframes map-float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-20px, -20px); }
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 24px 40px;
    }

    .game-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .game-icon-large {
      font-size: 72px;
      line-height: 1;
      display: block;
      text-align: center;
      margin: 0 auto 16px;
    }

    .game-title {
      display: block;
      font-size: 36px;
      font-weight: 800;
      margin: 0 0 10px;
      background: linear-gradient(135deg, var(--globe-gradient-1) 0%, var(--globe-gradient-2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-decoration: none;
    }

    .game-desc {
      font-size: 16px;
      color: var(--text-secondary);
      margin: 0;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin: 36px 0 16px;
    }

    .diff-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 28px 20px;
      text-decoration: none;
      color: var(--text-primary);
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .diff-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg,
        rgba(var(--accent-color-rgb), 0.15) 0%,
        rgba(var(--accent-color-rgb), 0.05) 100%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .diff-card:hover {
      transform: translateY(-6px);
      border-color: var(--card-border-hover);
      box-shadow: 0 16px 48px var(--card-shadow);
    }

    .diff-card:hover::before {
      opacity: 1;
    }

    .diff-emoji {
      font-size: 40px;
      display: block;
      margin-bottom: 12px;
      line-height: 1;
    }

    .diff-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .diff-rounds {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .diff-record {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      opacity: 0.85;
    }

    .diff-play {
      display: inline-block;
      padding: 8px 20px;
      background: var(--button-bg);
      border: 1px solid var(--button-border);
      border-radius: 10px;
      color: var(--button-text);
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
    }

    .diff-card:hover .diff-play {
      background: var(--button-bg-hover);
      border-color: var(--button-border-hover);
      color: var(--button-text-hover);
    }

    @media (max-width: 600px) {
      .content {
        padding: 40px 16px 32px;
      }

      .game-title {
        font-size: 28px;
      }

      .card-grid {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .diff-card {
        padding: 20px 16px;
        display: flex;
        align-items: center;
        gap: 16px;
        text-align: left;
      }

      .diff-emoji {
        font-size: 32px;
        margin: 0;
        flex-shrink: 0;
      }

      .diff-info {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 1px 10px;
        align-items: start;
      }

      .diff-name {
        grid-column: 1;
        grid-row: 1;
        font-size: 18px;
        margin-bottom: 0;
      }

      .diff-rounds {
        grid-column: 1;
        grid-row: 2;
        margin-bottom: 0;
      }

      .diff-record {
        grid-column: 2;
        grid-row: 1 / 3;
        align-self: center;
        text-align: right;
        margin: 0;
      }

      .diff-play {
        grid-column: 1 / 3;
        grid-row: 3;
        margin: 8px 0 0;
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <div class="map-background"></div>
  <div class="map-dots"></div>

  <div class="content">
    <div class="game-header" id="game-header">
      <!-- Filled by JS -->
    </div>

    <div id="game-cards">
      <!-- Filled by JS -->
    </div>
  </div>

  <script>
    const STORAGE_PREFIX = 'geoquiz-record-';

    function getRecord(key) {
      try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + key)); } catch { return null; }
    }

    function fmtTime(s) {
      const r = Math.round(s), m = Math.floor(r / 60), ss = String(r % 60).padStart(2, '0');
      return `${m}:${ss}`;
    }

    const GAMES = {
      find: {
        title: 'Find the Country',
        desc: 'Locate and click on the correct country on the interactive world map.',
        url: 'find-country.html',
        fullCount: 194,
        pointsPerRound: 1,
        icon: `<div class="game-icon-large">🗺️</div>`
      },
      outlines: {
        title: 'Guess the Country',
        desc: 'Identify countries from their unique outlines and geographical shapes.',
        url: 'outlines.html',
        fullCount: 194,
        pointsPerRound: 2,
        icon: `<div class="game-icon-large">🌍</div>`
      },
      capitals: {
        title: 'Capitals of the World',
        desc: 'Guess the capitals and their locations on an interactive world map.',
        url: 'capitals.html',
        fullCount: 194,
        pointsPerRound: 2,
        icon: `<div class="game-icon-large">🏛️</div>`
      },
      trivia: {
        title: 'Geography Trivia',
        desc: 'Answer multiple-choice questions about world geography and culture.',
        url: 'trivia.html',
        fullCount: 124,
        pointsPerRound: 1,
        icon: `<div class="game-icon-large">📚</div>`
      },
      heritage: {
        title: 'UNESCO Heritage',
        desc: 'Identify countries from stunning UNESCO World Heritage Sites.',
        url: 'heritage.html',
        fullCount: 47,
        pointsPerRound: 2,
        icon: `<div class="game-icon-large">🖼️</div>`
      },
      flags: {
        title: 'Flags of the World',
        desc: 'Match the flag to the country — nearby neighbors make it tricky.',
        url: 'flags.html',
        fullCount: 194,
        pointsPerRound: 1,
        icon: `<div class="game-icon-large">🚩</div>`
      },
      route: {
        title: 'Connect the Countries',
        desc: 'Find the land route between two countries through neighboring borders.',
        url: 'route.html',
        fullCount: 194,
        pointsPerRound: null,
        icon: `<div class="game-icon-large">🔗</div>`,
        customDifficulties: [
          { key: 'easy',   urlParam: 'difficulty=easy',   label: 'Easy',   emoji: '⚡', desc: '1–2 countries between' },
          { key: 'normal', urlParam: 'difficulty=normal', label: 'Normal', emoji: '🎯', desc: '3–6 countries between' },
          { key: 'hard',   urlParam: 'difficulty=hard',   label: 'Hard',   emoji: '🏆', desc: '7+ countries between' },
        ],
        continentSlugs: ['africa', 'americas', 'asia', 'europe'], // Oceania excluded (no land borders)
      },
      rivers: {
        title: 'Rivers & Mountain Ranges',
        desc: 'Click every country a river flows through, or every country a mountain range spans.',
        url: 'rivers.html',
        pointsPerRound: null,
        icon: `<div class="game-icon-large">🌵</div>`,
        noContinent: true,
        customDifficulties: [
          { key: 'rivers-short', url: 'rivers.html',    urlParam: 'rounds=10',  label: 'Rivers – Short',    emoji: '🐟', desc: '10 rivers' },
          { key: 'rivers-long',  url: 'rivers.html',    urlParam: 'rounds=all', label: 'Rivers – All',      emoji: '🐟', desc: 'All 22 rivers' },
          { key: 'mountains-all',url: 'mountains.html', urlParam: '',           label: 'Mountain Ranges',   emoji: '⛰️', desc: 'All 16 ranges' },
        ],
      },
    };

    const DIFFICULTIES = [
      { key: 'short',  rounds: '10',  label: 'Short',  emoji: '⚡', desc: '10 rounds' },
      { key: 'medium', rounds: '25',  label: 'Medium', emoji: '🎯', desc: '25 rounds' },
      { key: 'long',   rounds: 'all', label: 'Long',   emoji: '🏆', desc: null /* filled per game */ }
    ];

    // All 5 continents for standard games
    const CONTINENTS = [
      { label: 'Africa',   slug: 'africa',   continent: 'Africa',   emoji: '🌍' },
      { label: 'Americas', slug: 'americas', continent: 'Americas', emoji: '🌎' },
      { label: 'Asia',     slug: 'asia',     continent: 'Asia',     emoji: '🌏' },
      { label: 'Europe',   slug: 'europe',   continent: 'Europe',   emoji: '🌍' },
      { label: 'Oceania',  slug: 'oceania',  continent: 'Oceania',  emoji: '🌏' },
    ];

    const params = new URLSearchParams(location.search);
    const gameKey = params.get('game');
    const game = GAMES[gameKey];

    if (!game) {
      location.href = 'index.html';
    } else {
      document.title = `Geo Quiz - ${game.title}`;

      document.getElementById('game-header').innerHTML = `
        <a href="index.html" style="text-decoration:none">${game.icon}</a>
        <a href="index.html" class="game-title">${game.title}</a>
        <p class="game-desc">${game.desc}</p>
      `;

      const supportsContinent = !game.noContinent && !['trivia', 'heritage'].includes(gameKey);

      function makeCard(href, emoji, name, rounds, recordHtml) {
        return `
          <a class="diff-card" href="${href}">
            <span class="diff-emoji">${emoji}</span>
            <div class="diff-info">
              <div class="diff-name">${name}</div>
              <div class="diff-rounds">${rounds}</div>
              ${recordHtml}
              <span class="diff-play">Play →</span>
            </div>
          </a>`;
      }

      function renderGame(continentsData) {
        function countFor(continent) {
          if (!continentsData) return '…';
          return Object.values(continentsData).filter(c => c === continent).length;
        }

        const diffs = game.customDifficulties || DIFFICULTIES;

        // --- Difficulty / mode section ---
        const diffCards = diffs.map(d => {
          let href, roundsLabel, recHtml = '';
          if (game.customDifficulties) {
            const base = d.url || game.url;
            href = d.urlParam ? `${base}?${d.urlParam}` : base;
            roundsLabel = d.desc;
            if (d.key) {
              const rec = getRecord(d.key);
              if (rec) recHtml = `<div class="diff-record">Best: ${rec.bestScore}pts · ${fmtTime(rec.bestTime)}</div>`;
            }
          } else {
            const count = d.rounds === 'all' ? game.fullCount : parseInt(d.rounds);
            const maxScore = count * game.pointsPerRound;
            const rec = getRecord(`${gameKey}-${d.key}`);
            roundsLabel = d.rounds === 'all' ? `All ${game.fullCount} rounds` : d.desc;
            recHtml = rec
              ? `<div class="diff-record">Best: ${rec.bestScore}/${maxScore} · ${fmtTime(rec.bestTime)}</div>`
              : '';
            href = `${game.url}?rounds=${d.rounds}`;
          }
          return makeCard(href, d.emoji, d.label, roundsLabel, recHtml);
        }).join('');

        let html = `<div class="card-grid">${diffCards}</div>`;

        // --- Continent section ---
        if (supportsContinent) {
          // Use game-specific continent list if defined (e.g. route excludes Oceania)
          const contList = game.continentSlugs
            ? CONTINENTS.filter(c => game.continentSlugs.includes(c.slug))
            : CONTINENTS;

          const contCards = contList.map(c => {
            const count = countFor(c.continent);
            let href, recHtml = '';
            if (game.customDifficulties) {
              href = `${game.url}?continent=${encodeURIComponent(c.continent)}`;
            } else {
              href = `${game.url}?rounds=all&continent=${encodeURIComponent(c.continent)}`;
              const rec = getRecord(`${gameKey}-${c.slug}-long`);
              const maxScore = typeof count === 'number' ? count * game.pointsPerRound : null;
              recHtml = rec && maxScore
                ? `<div class="diff-record">Best: ${rec.bestScore}/${maxScore} · ${fmtTime(rec.bestTime)}</div>`
                : '';
            }
            return makeCard(href, c.emoji, c.label, `All ${count} rounds`, recHtml);
          }).join('');

          html += `<div class="section-label">By continent</div>
                   <div class="card-grid">${contCards}</div>`;
        }

        document.getElementById('game-cards').innerHTML = html;
      }

      // Initialize
      (async () => {
        let continentsData = null;
        if (supportsContinent) {
          try {
            continentsData = await fetch('data/countries-continents.json').then(r => r.json());
          } catch (e) {
            console.warn('Could not load continents:', e);
          }
        }

        renderGame(continentsData);
      })();
    }
  </script>
</body>
</html>
