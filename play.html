<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Geo Quiz - Select Difficulty</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script>
    (function() {
      const saved = localStorage.getItem('geoquiz-theme');
      const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const theme = saved || system;
      if (theme === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/play.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <div class="map-background"></div>
  <div class="map-dots"></div>

  <div class="content">
    <div class="game-header" id="game-header">
      <!-- Filled by JS -->
    </div>

    <div id="region-bar">
      <!-- Filled by JS -->
    </div>

    <div id="game-cards">
      <!-- Filled by JS -->
    </div>
  </div>

  <script>
    const STORAGE_PREFIX = 'geoquiz-record-';

    function getRecord(key) {
      try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + key)); } catch { return null; }
    }

    function fmtTime(s) {
      const r = Math.round(s), m = Math.floor(r / 60), ss = String(r % 60).padStart(2, '0');
      return `${m}:${ss}`;
    }

    const GAMES = {
      find: {
        title: 'Countries',
        desc: 'Find countries on the map or spell their names from a scrambled hint.',
        url: 'find-country.html',
        fullCount: 194,
        pointsPerRound: 1,
        icon: '🗺️',
        customDifficulties: [
          { key: 'find-easy',   url: 'find-country.html', urlParam: 'difficulty=easy&rounds=all', label: 'Find – Easy', emoji: '🌱', desc: 'Well-known countries' },
          { key: 'find-hard',   url: 'find-country.html', urlParam: 'difficulty=hard&rounds=all', label: 'Find – Hard', emoji: '💀', desc: 'Small countries & islands' },
          { key: 'find-short',  url: 'find-country.html', urlParam: 'rounds=10',  label: 'Find – Short',  emoji: '⚡', desc: '10 rounds' },
          { key: 'find-long',   url: 'find-country.html', urlParam: 'rounds=all', label: 'Find – All',    emoji: '🏆', desc: 'All countries' },
          { key: 'find-streak', url: 'find-country.html', urlParam: 'mode=streak', label: 'Find – Streak', emoji: '🔥', desc: 'One wrong answer ends the game' },
          { key: 'spelling-countries-short',  url: 'spelling.html', urlParam: 'mode=countries&rounds=10',  label: 'Spelling – Short',  emoji: '🔤', desc: '10 country names' },
          { key: 'spelling-countries-long',   url: 'spelling.html', urlParam: 'mode=countries&rounds=all', label: 'Spelling – All',    emoji: '🔤', desc: 'All countries' },
        ],
      },
      outlines: {
        title: 'Country Outline',
        desc: 'Identify countries from their outline, rotate them to the correct orientation, or both.',
        url: 'outlines.html',
        pointsPerRound: null,
        icon: `<img src="img/icon-logo-small.svg" alt="" style="width:1.2em;height:1.2em;vertical-align:-0.15em">`,
        customDifficulties: [
          { key: 'outlines-short',       url: 'outlines.html', urlParam: 'rounds=10',  label: 'Guess – Short',           emoji: '❓', desc: '10 rounds · name the country' },
          { key: 'outlines-long',        url: 'outlines.html', urlParam: 'rounds=all', label: 'Guess – All',             emoji: '❓', desc: 'All countries · name the country' },
          { key: 'outlines-streak',      url: 'outlines.html', urlParam: 'mode=streak', label: 'Guess – Streak',         emoji: '🔥', desc: 'One wrong answer ends the game' },
          { key: 'pairs-outlines', url: 'pairs.html', urlParam: 'mode=outlines', label: 'Pairs – Outlines', emoji: '🔗', desc: 'Match countries with their outlines' },
          { key: 'rotate-only-short',    url: 'outlines.html', urlParam: 'rounds=10&mode=rotate-only',   label: 'Rotate – Short',  emoji: 'rotate-svg', desc: '10 rounds · name shown' },
          { key: 'rotate-only-long',     url: 'outlines.html', urlParam: 'rounds=all&mode=rotate-only',  label: 'Rotate – All',    emoji: 'rotate-svg', desc: 'All countries · name shown' },
          { key: 'rotated-short',        url: 'outlines.html', urlParam: 'rounds=10&mode=rotated',       label: 'Rotate & Guess – Short',  emoji: '⚡', desc: '10 rounds · rotate & guess' },
          { key: 'rotated-long',         url: 'outlines.html', urlParam: 'rounds=all&mode=rotated',      label: 'Rotate & Guess – All',    emoji: '🏆', desc: 'All countries · rotate & guess' },
        ],
      },
      capitals: {
        title: 'Cities',
        desc: 'Guess capitals, place cities on the map, or spell city names from a scrambled hint.',
        url: 'capitals.html',
        fullCount: 194,
        pointsPerRound: 2,
        icon: '🏛️',
        customDifficulties: [
          { key: 'capitals-short',  url: 'capitals.html', urlParam: 'rounds=10',  label: 'Capitals – Short',  emoji: '⚡', desc: '10 rounds' },
          { key: 'capitals-long',   url: 'capitals.html', urlParam: 'rounds=all', label: 'Capitals – All',    emoji: '🏆', desc: 'All countries' },
          { key: 'capitals-streak', url: 'capitals.html', urlParam: 'mode=streak', label: 'Capitals – Streak', emoji: '🔥', desc: 'One wrong answer ends the game' },
          { key: 'place-cities-short',  url: 'cities.html', urlParam: 'rounds=5',   label: 'Place Cities – Short',  emoji: '📍', desc: '5 rounds' },
          { key: 'place-cities-long',   url: 'cities.html', urlParam: 'rounds=all', label: 'Place Cities – All',    emoji: '📍', desc: 'All countries' },
          { key: 'spelling-cities-short',  url: 'spelling.html', urlParam: 'mode=cities&rounds=10',  label: 'Spelling – Short',  emoji: '🔤', desc: '10 city names' },
          { key: 'spelling-cities-long',   url: 'spelling.html', urlParam: 'mode=cities&rounds=all', label: 'Spelling – All',    emoji: '🔤', desc: 'All cities' },
          { key: 'pairs', url: 'pairs.html', urlParam: 'mode=capitals', label: 'Pairs – Capitals', emoji: '🔗', desc: 'Match countries with capitals' },
          { key: 'pairs-cities', url: 'pairs.html', urlParam: 'mode=cities', label: 'Pairs – Cities', emoji: '🔗', desc: 'Match countries with their cities' },
        ],
      },
      trivia: {
        title: 'Geography Trivia',
        desc: 'Answer multiple-choice questions about world geography and culture.',
        url: 'trivia.html',
        fullCount: 124,
        pointsPerRound: 1,
        icon: '📚',
        noContinent: true,
        customDifficulties: [
          { key: 'trivia-short',  url: 'trivia.html', urlParam: 'rounds=10',   label: 'Short',  emoji: '⚡', desc: '10 questions' },
          { key: 'trivia-long',   url: 'trivia.html', urlParam: 'rounds=all',  label: 'All',    emoji: '🏆', desc: 'All 124 questions' },
          { key: 'trivia-streak', url: 'trivia.html', urlParam: 'mode=streak', label: 'Streak', emoji: '🔥', desc: 'One wrong answer ends the game' },
        ],
      },
      heritage: {
        title: 'UNESCO Heritage',
        desc: 'Guess which country a UNESCO site belongs to, or pinpoint its location on the map.',
        url: 'heritage.html',
        pointsPerRound: null,
        icon: '🖼️',
        noContinent: true,
        customDifficulties: [
          { key: 'heritage-short',  url: 'heritage.html', urlParam: 'rounds=10',  label: 'Guess – Short',  emoji: '🖼️', desc: '10 sites · guess the country' },
          { key: 'heritage-long',   url: 'heritage.html', urlParam: 'rounds=all', label: 'Guess – All',    emoji: '🖼️', desc: 'All 116 sites · guess the country' },
          { key: 'heritage-streak', url: 'heritage.html', urlParam: 'mode=streak', label: 'Guess – Streak', emoji: '🔥', desc: 'One wrong answer ends the game' },
          { key: 'heritage-locate-short',  url: 'heritage-locate.html', urlParam: 'rounds=10',  label: 'Locate – Short',  emoji: '📍', desc: '10 sites · pinpoint on map' },
          { key: 'heritage-locate-long',   url: 'heritage-locate.html', urlParam: 'rounds=all', label: 'Locate – All',    emoji: '📍', desc: 'All 116 sites · pinpoint on map' },
        ],
      },
      flags: {
        title: 'Flags',
        desc: 'Match the flag to the country — nearby neighbors make it tricky.',
        url: 'flags.html',
        fullCount: 194,
        pointsPerRound: 1,
        icon: '🚩',
        customDifficulties: [
          { key: 'flags-short',  url: 'flags.html', urlParam: 'rounds=10',   label: 'Short',  emoji: '⚡', desc: '10 rounds' },
          { key: 'flags-long',   url: 'flags.html', urlParam: 'rounds=all',  label: 'All',    emoji: '🏆', desc: 'All 194 flags' },
          { key: 'flags-streak', url: 'flags.html', urlParam: 'mode=streak', label: 'Streak', emoji: '🔥', desc: 'One wrong answer ends the game' },
          { key: 'pairs-flags', url: 'pairs.html', urlParam: 'mode=flags', label: 'Pairs – Flags', emoji: '🔗', desc: 'Match countries with their flags' },
        ],
      },
      route: {
        title: 'Route',
        desc: 'Find the land route between two countries through neighboring borders, or play the Carmen detective game.',
        url: 'route.html',
        fullCount: 194,
        pointsPerRound: null,
        icon: '🧭',
        customDifficulties: [
          { key: 'easy',   urlParam: 'difficulty=easy',   label: 'Easy',   emoji: '⚡', desc: '1–2 countries between' },
          { key: 'normal', urlParam: 'difficulty=normal', label: 'Normal', emoji: '🎯', desc: '3–6 countries between' },
          { key: 'hard',   urlParam: 'difficulty=hard',   label: 'Hard',   emoji: '🏆', desc: '7+ countries between' },
          { key: 'carmen-campaign', url: 'carmen.html', urlParam: 'mode=campaign', label: 'The Crimson Trail', emoji: '🔍', desc: 'Track Carmen through a 10-case border chase', worldOnly: true },
          { key: 'carmen-open-cases', url: 'carmen.html', urlParam: 'mode=open_cases', label: 'Open Cases', emoji: '🗂️', desc: 'Standalone detective cases', worldOnly: true },
          { key: 'carmen-skyline-syndicate', url: 'carmen.html', urlParam: 'mode=skyline_syndicate', label: 'Skyline Syndicate', emoji: '✈️', desc: 'Carmen campaign through capital flight corridors', worldOnly: true },
        ],
        continentSlugs: ['africa', 'americas', 'asia', 'europe'], // Oceania excluded (no land borders)
      },
      rivers: {
        title: 'Rivers & Mountains',
        desc: 'Click countries a river or mountain range spans, or pinpoint peaks on the map.',
        url: 'rivers.html',
        pointsPerRound: null,
        icon: '🌵',
        customDifficulties: [
          { key: 'rivers-easy-short',  url: 'rivers.html',    urlParam: 'rounds=10&mode=easy', label: 'Rivers – Easy',     emoji: '🐟', desc: '10 rivers · pick one country', worldOnly: true },
          { key: 'rivers-short',       url: 'rivers.html',    urlParam: 'rounds=10',           label: 'Rivers – Hard',     emoji: '🐟', desc: '10 rivers · pick all countries', worldOnly: true },
          { key: 'rivers-long',        url: 'rivers.html',    urlParam: 'rounds=all',          label: 'Rivers – All',      emoji: '🐟', desc: 'All 22 rivers · pick all countries', worldOnly: true },
          { key: 'mountains-easy-short', url: 'mountains.html', urlParam: 'rounds=10&mode=easy', label: 'Mountains – Easy',  emoji: '⛰️', desc: '10 ranges · pick one country', worldOnly: true },
          { key: 'mountains-short',      url: 'mountains.html', urlParam: 'rounds=10',           label: 'Mountains – Hard',  emoji: '⛰️', desc: '10 ranges · pick all countries', worldOnly: true },
          { key: 'mountains-long',       url: 'mountains.html', urlParam: '',                    label: 'Mountains – All',   emoji: '⛰️', desc: 'All 16 ranges · pick all countries', worldOnly: true },
          { key: 'peaks-short',  url: 'peaks.html', urlParam: 'rounds=10',  label: 'Peaks – Short',  emoji: '▲', desc: '10 peaks · click the location', excludeContinents: ['Oceania'] },
          { key: 'peaks-long',   url: 'peaks.html', urlParam: 'rounds=all', label: 'Peaks – All',    emoji: '▲', desc: 'All peaks · click the location' },
          { key: 'pairs-peaks', url: 'pairs.html', urlParam: 'mode=peaks', label: 'Pairs – Peaks', emoji: '🔗', desc: 'Match countries with highest peaks' },
        ],
      },
      duel: {
        title: 'Country Duel',
        desc: 'Two countries face off — pick the right answer to keep your streak alive!',
        url: 'duel.html',
        pointsPerRound: null,
        icon: '🆚',
        customDifficulties: [
          { key: 'duel', url: 'duel.html', urlParam: '', label: 'Play', emoji: '🆚', desc: 'Pick the right country' },
          { key: 'duel-daily', url: 'duel.html', urlParam: 'mode=daily', label: 'Daily', emoji: '📅', desc: 'Same questions for everyone today' },
        ],
      },
      jigsaw: {
        title: 'Map Jigsaw',
        desc: 'Drag country shapes onto a blank map to reassemble a continent.',
        url: 'jigsaw.html',
        pointsPerRound: null,
        icon: '🧩',
        customDifficulties: [
          { key: 'jigsaw-short', url: 'jigsaw.html', urlParam: 'mode=major', label: 'Major Countries', emoji: '⚡', desc: '10–15 largest · names shown', excludeContinents: ['Oceania'] },
          { key: 'jigsaw-long',  url: 'jigsaw.html', urlParam: '',           label: 'All Countries',   emoji: '🧩', desc: 'Every country · drag shapes onto map' },
        ],
      },
    };

    const DIFFICULTIES = [
      { key: 'short',  rounds: '10',  label: 'Short',  emoji: '⚡', desc: '10 rounds' },
      { key: 'long',   rounds: 'all', label: 'Long',   emoji: '🏆', desc: null /* filled per game */ }
    ];

    const CONTINENTS = [
      { label: 'Africa',   continent: 'Africa',   emoji: '🌍' },
      { label: 'Americas', continent: 'Americas', emoji: '🌎' },
      { label: 'Asia',     continent: 'Asia',     emoji: '🌏' },
      { label: 'Europe',   continent: 'Europe',   emoji: '🌍' },
      { label: 'Oceania',  continent: 'Oceania',  emoji: '🌏' },
    ];

    const params = new URLSearchParams(location.search);
    const gameKey = params.get('game');
    const continent = params.get('continent');
    const game = GAMES[gameKey];

    if (!game) {
      location.href = 'index.html';
    } else {
      document.title = `Geo Quiz - ${game.title}`;

      document.getElementById('game-header').innerHTML = `
        <a href="index.html" style="text-decoration:none"><div class="game-icon-large">${game.icon}</div></a>
        <a href="index.html" class="game-title">${game.title}</a>
        <p class="game-desc">${game.desc}</p>
      `;

      // Region toggle bar
      {
        const bar = document.getElementById('region-bar');
        const isNoContinent = game.noContinent;
        const allowedSlugs = game.continentSlugs || null;

        function regionUrl(cont) {
          const p = new URLSearchParams(location.search);
          if (cont) {
            p.set('continent', cont);
          } else {
            p.delete('continent');
          }
          return `play.html?${p.toString()}`;
        }

        // World button
        const worldActive = !continent;
        let btns = `<button class="region-btn${worldActive ? ' active' : ''}" onclick="location.href='${regionUrl(null)}'"><span class="region-emoji">🌐 </span>World</button>`;

        CONTINENTS.forEach(c => {
          const slug = c.continent.toLowerCase();
          const isActive = continent === c.continent;
          const isExcluded = allowedSlugs && !allowedSlugs.includes(slug);
          const isDisabled = isNoContinent || isExcluded;

          if (isExcluded) return; // Don't render excluded continents (e.g., Oceania for route)

          const cls = `region-btn${isActive ? ' active' : ''}${isDisabled ? ' disabled' : ''}`;
          const click = isDisabled ? '' : `onclick="location.href='${regionUrl(c.continent)}'"`;
          btns += `<button class="${cls}" ${click}><span class="region-emoji">${c.emoji} </span>${c.label}</button>`;
        });

        bar.innerHTML = `<div class="region-bar">${btns}</div>`;
      }

      // Compute continent slug for record keys
      const continentSlug = continent ? continent.toLowerCase() : '';

      const ROTATE_SVG = `<svg style="width:1em;height:1em;vertical-align:-0.1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10"/><path d="M3.51 15A9 9 0 0 0 18.36 18.36L23 14"/></svg>`;

      function makeCard(href, emoji, name, rounds, recordHtml) {
        const icon = emoji === 'rotate-svg' ? ROTATE_SVG : emoji;
        return `
          <a class="diff-card" href="${href}">
            <span class="diff-emoji">${icon}</span>
            <div class="diff-info">
              <div class="diff-name">${name}</div>
              <div class="diff-rounds">${rounds}</div>
              ${recordHtml}
              <span class="diff-play">Play →</span>
            </div>
          </a>`;
      }

      (async () => {
        // Resolve the actual country count for the selected region
        let fullCount = game.fullCount;
        if (continent) {
          try {
            const all = await fetch('data/countries.json').then(r => r.json());
            fullCount = all.filter(c => c.un && c.continent === continent).length;
          } catch (e) {
            console.warn('Could not load countries:', e);
          }
        }

        // Filter out difficulties whose fixed round count exceeds the region size
        const baseDiffs = game.customDifficulties || DIFFICULTIES;
        const diffs = baseDiffs.filter(d => {
          if (continent && d.worldOnly) return false;
          if (continent && d.excludeContinents && d.excludeContinents.includes(continent)) return false;
          if (game.customDifficulties) return true;
          if (d.rounds === 'all') return true;
          return parseInt(d.rounds) < fullCount;
        });

        const continentParam = continent ? `&continent=${encodeURIComponent(continent)}` : '';

        const diffCards = diffs.map(d => {
          let href, roundsLabel, recHtml = '';
          if (game.customDifficulties) {
            const base = d.url || game.url;
            const qParts = [d.urlParam, continentParam.slice(1)].filter(Boolean).join('&');
            href = qParts ? `${base}?${qParts}` : base;
            roundsLabel = d.desc;
            if (d.key) {
              const recKey = continentSlug ? `${d.key}-${continentSlug}` : d.key;
              const rec = getRecord(recKey);
              if (rec) recHtml = `<div class="diff-record"><span class="rec-label">Best:</span> <span class="rec-value">${rec.bestScore}pts</span><span class="rec-sep"> · </span><span class="rec-label">Time:</span> <span class="rec-value">${fmtTime(rec.bestTime)}</span></div>`;
            }
          } else {
            const count = d.rounds === 'all' ? fullCount : parseInt(d.rounds);
            const maxScore = count * game.pointsPerRound;
            const recKey = continentSlug ? `${gameKey}-${continentSlug}-${d.key}` : `${gameKey}-${d.key}`;
            const rec = getRecord(recKey);
            roundsLabel = d.rounds === 'all' ? `All ${fullCount} rounds` : d.desc;
            recHtml = rec
              ? `<div class="diff-record"><span class="rec-label">Best:</span> <span class="rec-value">${rec.bestScore}/${maxScore}</span><span class="rec-sep"> · </span><span class="rec-label">Time:</span> <span class="rec-value">${fmtTime(rec.bestTime)}</span></div>`
              : '';
            href = `${game.url}?rounds=${d.rounds}${continentParam}`;
          }
          return makeCard(href, d.emoji, d.label, roundsLabel, recHtml);
        }).join('');

        const gridClass = diffs.length <= 2 ? 'card-grid two-cards'
          : diffs.length === 9 ? 'card-grid three-cols' : 'card-grid';
        document.getElementById('game-cards').innerHTML = `<div class="${gridClass}">${diffCards}</div>`;
      })();
    }
  </script>

  <script src="js/menu.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
