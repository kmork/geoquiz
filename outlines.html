<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Country Outline Quiz</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Prevent FOUC - apply theme immediately
    (function() {
      const saved = localStorage.getItem('geoquiz-theme');
      const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const theme = saved || system;
      if (theme === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>
</head>

<body>
<div class="wrap">
  <div class="card">

    <div id="init-overlay">
      <div class="spinner"></div>
      <div>Loading GeoQuiz...</div>
    </div>

    <div class="row row-space-between">
      <div>
        <h1>
          <a href="index.html" style="text-decoration: none; color: inherit;">
            <img class="game-header-icon" src="img/icon-logo-small.svg" alt="">
            <span id="game-title">Country Outline</span>
          </a>
        </h1>
        <div class="muted" id="game-subtitle">Identify the country from its outline.</div>
      </div>
      <div class="row">
        <div class="pill">Score: <b id="score">0</b></div>
        <div class="pill">Round: <b id="progress">0 / 193</b></div>
      </div>
    </div>

    <div class="hr"></div>

    <div id="country-label" style="display:none; text-align:center; font-size:1.3rem; font-weight:700; margin:0 0 0.5rem"></div>

    <div class="mapwrap">
      <svg id="map" viewBox="0 0 600 320" width="100%"></svg>
    </div>

    <div id="status" class="status" style="display:none"></div>

    <div class="answerRow">
      <input id="answer" list="country-suggestions" placeholder="Type the country name…" autocomplete="off"/>
      <datalist id="country-suggestions">
        <!-- Populated dynamically by JavaScript -->
      </datalist>
      <button id="submit">Guess</button>
    </div>

  </div>
</div>

<!-- Final score screen (content generated by JS) -->
<div class="overlay" id="finalOverlay" role="dialog" aria-modal="true"></div>

<canvas id="confetti"></canvas>

<script src="js/pako.min.js"></script>
<script src="js/mobile-autocomplete.js"></script>
<script src="js/theme.js"></script>
<script type="module" src="js/data.js"></script>
<script type="module">
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode');
  if (mode === 'rotated' || mode === 'rotate-only') {
    if (mode === 'rotated') {
      document.getElementById('game-title').textContent = 'Rotate and Guess';
      document.getElementById('game-subtitle').textContent = 'Rotate the outline back to its correct orientation and name the country.';
    } else {
      document.getElementById('game-title').textContent = 'Rotate the Outline';
      document.getElementById('game-subtitle').textContent = 'Rotate the outline back to its correct orientation.';
    }
    import('./js/rotated-main.js');
  } else {
    import('./js/outlines-main.js');
  }
</script>

</body>
</html>
