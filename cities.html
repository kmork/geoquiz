<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Place the Cities</title>
  <script>
    (function() {
      const p = new URLSearchParams(location.search);
      const c = p.get('continent');
      const label = 'Place the Cities – ' + (c || 'World');
      document.title = label;
      document.addEventListener('DOMContentLoaded', () => {
        const h1 = document.querySelector('h1');
        if (h1) h1.innerHTML = `<a href="index.html" style="text-decoration: none; color: inherit;"><span class="game-header-icon">📍</span>${label}</a>`;
      });
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Prevent FOUC - apply theme immediately
    (function() {
      const saved = localStorage.getItem('geoquiz-theme');
      const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const theme = saved || system;
      if (theme === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>
</head>

<body>
<div class="wrap">
  <div class="card">

    <div id="init-overlay">
      <div class="spinner"></div>
      <div>Loading GeoQuiz...</div>
    </div>

    <div class="row row-space-between">
      <div>
        <h1>
          <a href="index.html" style="text-decoration: none; color: inherit;">
            <span class="game-header-icon">📍</span>
            Place the Cities
          </a>
        </h1>
        <div class="muted">Drag city names to the correct dots on the map.</div>
      </div>
      <div class="row">
        <div class="pill">
          Score: <b id="score">0</b>
        </div>
        <div class="pill">Round: <b id="progress">0 / 0</b></div>
      </div>
    </div>

    <div class="hr"></div>

    <div class="muted">Country:</div>
    <div class="country" id="countryName">—</div>

    <div class="mapwrap">
      <svg id="map" viewBox="0 0 600 320" width="100%"></svg>
    </div>

    <div id="city-labels" class="city-labels"></div>

    <div class="answerRow">
      <button id="submit" disabled>Submit</button>
    </div>

  </div>
</div>

<!-- Final score screen (content generated by JS) -->
<div class="overlay" id="finalOverlay" role="dialog" aria-modal="true"></div>

<canvas id="confetti"></canvas>

<!-- IMPORTANT: data first, then app -->
<script src="js/pako.min.js"></script>
<script src="js/theme.js"></script>
<script type="module" src="js/data.js"></script>
<script type="module" src="js/place-cities-main.js"></script>

</body>
</html>
