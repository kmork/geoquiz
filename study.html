<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Study Mode — GeoQuiz</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/study.css">
  <script>
    // Prevent FOUC - apply theme immediately
    (function() {
      const saved = localStorage.getItem('geoquiz-theme');
      const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const theme = saved || system;
      if (theme === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>
</head>

<body>
<div class="wrap study-page">
  <div class="card">

    <div id="init-overlay">
      <div class="spinner"></div>
      <div>Loading GeoQuiz...</div>
    </div>

    <div class="row row-space-between">
      <div>
        <h1>
          <a href="index.html" style="text-decoration: none; color: inherit;">
            <span class="game-header-icon">📖</span>
            Study Mode
          </a>
        </h1>
        <div class="muted">Explore the world with interactive overlays for countries, rivers, mountains, heritage sites, and more.</div>
      </div>
    </div>

    <div class="hr"></div>

    <div class="mapwrap">
      <input id="study-search" type="text" placeholder="Search countries, cities, rivers…" autocomplete="off">
      <canvas id="map"></canvas>
      <div id="study-info" class="study-info-panel" style="display:none"></div>
      <div id="study-history" class="study-history-card" style="display:none">
        <div class="study-history-header">
          <span class="study-history-label">📜 History</span>
          <button class="study-history-close" id="study-history-close" aria-label="Close">✕</button>
        </div>
        <div class="study-history-divider"></div>
        <div class="study-history-text" id="study-history-text"></div>
      </div>
      <div id="heritage-popup" class="heritage-popup" style="display:none">
        <button class="heritage-popup-close" id="heritage-popup-close" aria-label="Close">✕</button>
        <div style="position:relative">
          <img class="heritage-popup-img" id="heritage-popup-img" src="" alt="">
          <span class="picture-credit" id="heritage-popup-credit"></span>
        </div>
        <div class="heritage-popup-footer">
          <div class="heritage-popup-name" id="heritage-popup-name"></div>
          <div class="heritage-popup-meta" id="heritage-popup-meta"></div>
          <div class="heritage-popup-summary" id="heritage-popup-summary"></div>
        </div>
      </div>
      <div id="fact-overlay" class="fact-overlay" style="display:none">
        <button class="fact-overlay-close" id="fact-overlay-close" aria-label="Close">✕</button>
        <div class="fact-overlay-title">Did you know?</div>
        <div class="fact-overlay-text" id="fact-overlay-text"></div>
        <div class="fact-overlay-footer">
          <span class="fact-overlay-category" id="fact-overlay-category"></span>
          <span class="fact-overlay-nav" id="fact-overlay-nav"></span>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="js/pako.min.js"></script>
<script src="js/mobile-autocomplete.js"></script>
<script src="js/menu.js" data-btn-container=".row-space-between"></script>
<script src="js/theme.js"></script>
<script type="module" src="js/data.js"></script>
<script type="module" src="js/study-main.js"></script>

</body>
</html>
