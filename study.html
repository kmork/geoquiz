<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Study Mode — GeoQuiz</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Prevent FOUC - apply theme immediately
    (function() {
      const saved = localStorage.getItem('geoquiz-theme');
      const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const theme = saved || system;
      if (theme === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>
  <style>
    /* ── Study info panel ── */
    .study-info-panel {
      position: absolute;
      bottom: 16px;
      left: 16px;
      z-index: 20;
      background: var(--panel-bg, rgba(15,20,40,.96));
      border: 1px solid var(--panel-border, rgba(255,255,255,.14));
      border-radius: 14px;
      padding: 14px 16px 12px;
      min-width: 210px;
      max-width: 280px;
      box-shadow: 0 4px 24px rgba(0,0,0,.35);
      pointer-events: none;
    }
    .study-info-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 0;
    }
    .study-info-flag {
      width: 44px;
      height: 30px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid var(--panel-border, rgba(255,255,255,.14));
      flex-shrink: 0;
    }
    .study-info-flag-placeholder {
      width: 44px;
      height: 30px;
      border-radius: 4px;
      background: var(--card-border, rgba(255,255,255,.12));
      flex-shrink: 0;
    }
    .study-info-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .study-info-region {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.2;
    }
    .study-info-divider {
      height: 1px;
      background: var(--hr-color, rgba(255,255,255,.12));
      margin: 10px 0 8px;
    }
    .study-info-rows {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .study-info-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }
    .study-info-row > span:first-child {
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .study-info-row > span:last-child {
      color: var(--text-primary);
      text-align: right;
      font-weight: 500;
    }
    .study-info-borders > span:last-child {
      text-align: right;
      max-width: 170px;
      word-break: break-word;
      hyphens: auto;
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">

    <div class="row row-space-between">
      <div>
        <h1>
          <a href="index.html" style="text-decoration: none; color: inherit;">
            <span class="game-header-icon">📖</span>
            Study Mode
          </a>
        </h1>
        <div class="muted">Explore the world map. Hover (or tap) any country to see its flag, capital, and geography.</div>
      </div>
    </div>

    <div class="hr"></div>

    <div class="mapwrap">
      <canvas id="map"></canvas>
      <div id="study-info" class="study-info-panel" style="display:none"></div>
    </div>

  </div>
</div>

<script src="js/pako.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/data.js"></script>
<script type="module" src="js/study-main.js"></script>

</body>
</html>
