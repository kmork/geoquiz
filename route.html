<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Route - Land Route Game</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Prevent FOUC - apply theme immediately
    (function() {
      const saved = localStorage.getItem('geoquiz-theme');
      const system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const theme = saved || system;
      if (theme === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>
</head>

<body>
<div class="wrap">
  <div class="card">

    <div id="init-overlay">
      <div class="spinner"></div>
      <div>Loading GeoQuiz...</div>
    </div>

    <div class="row row-space-between">
      <div>
        <h1>
          <a href="index.html" style="text-decoration: none; color: inherit;">
            <span class="game-header-icon">🧭</span>
            Route
          </a>
        </h1>
        <div class="muted">Find the shortest land route between two countries.</div>
      </div>
      <div class="row">
        <div class="pill">Score: <b id="score">0</b></div>
        <div class="pill">Optimal: <b id="optimalHint">?</b> countries</div>
      </div>
    </div>

    <div class="hr"></div>

    <div id="route" class="route-display">
      <span class="route-country start">France</span>
      <span class="route-arrow">→</span>
      <span class="route-placeholder">?</span>
      <span class="route-arrow">→</span>
      <span class="route-country end">Poland</span>
    </div>

    <div class="mapwrap">
      <svg id="map" viewBox="0 0 600 320" width="100%"></svg>
    </div>

    <div id="hint" class="hint-message" style="display:none"></div>

    <div class="answerRow">
      <input id="answer" list="country-suggestions" placeholder="Type the next country…" autocomplete="off"/>
      <datalist id="country-suggestions">
        <!-- Populated dynamically by JavaScript -->
      </datalist>
      <button id="submit">Add to Route</button>
      <div class="secondary-buttons">
        <button id="undo" class="btn-secondary" disabled>Undo</button>
        <button id="showHint" class="btn-secondary">Show Hint</button>
        <button id="giveUp" class="btn-secondary">Give Up</button>
      </div>
    </div>

    <div id="status" class="status" style="display:none"></div>

    <div id="end-actions" class="finish-actions" style="display:none">
      <button class="finish-btn finish-btn-primary" id="play-again">🔄 Play Again</button>
      <button class="finish-btn finish-btn-secondary" id="go-home"><img class="btn-icon" src="img/icon-logo-small.svg" alt=""> Home</button>
    </div>

  </div>
</div>

<canvas id="confetti"></canvas>

<script src="js/pako.min.js"></script>
<script src="js/mobile-autocomplete.js"></script>
<script src="js/theme.js"></script>
<script type="module" src="js/data.js"></script>
<script type="module" src="js/route-main.js"></script>

</body>
</html>
